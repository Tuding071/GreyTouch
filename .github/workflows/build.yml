name: Build AssistiveTouch APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate project structure
        run: |
          mkdir -p app/src/main/java/com/grey/touch
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/java/com/grey/touch/MainActivity.kt << 'KOTLIN_EOF'
          package com.grey.touch

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              var enabled by remember { mutableStateOf(isServiceEnabled()) }

                              Column(
                                  modifier = Modifier.fillMaxSize().padding(24.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.Center
                              ) {
                                  Text(
                                      text = if (enabled) "AssistiveTouch is enabled" else "AssistiveTouch is not enabled",
                                      style = MaterialTheme.typography.titleLarge
                                  )
                                  Spacer(modifier = Modifier.height(16.dp))
                                  Text(
                                      text = "This app needs Accessibility permission to show the floating bubble and control back/recents.",
                                      style = MaterialTheme.typography.bodyMedium
                                  )
                                  Spacer(modifier = Modifier.height(24.dp))
                                  Button(onClick = {
                                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                                  }) {
                                      Text("Open Accessibility Settings")
                                  }
                              }

                              LaunchedEffect(Unit) {
                                  enabled = isServiceEnabled()
                              }
                          }
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  recreate()
              }

              private fun isServiceEnabled(): Boolean {
                  val expected = "$packageName/${AssistiveTouchService::class.java.canonicalName}"
                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val splitter = TextUtils.SimpleStringSplitter(':')
                  splitter.setString(enabledServices)
                  while (splitter.hasNext()) {
                      if (splitter.next().equals(expected, ignoreCase = true)) return true
                  }
                  return false
              }
          }
          KOTLIN_EOF

          cat > app/src/main/java/com/grey/touch/AssistiveTouchService.kt << 'KOTLIN_EOF'
          package com.grey.touch

          import android.accessibilityservice.AccessibilityService
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.util.Base64
          import android.util.DisplayMetrics
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.io.ByteArrayOutputStream
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.abs

          class AssistiveTouchService : AccessibilityService() {

              private lateinit var windowManager: WindowManager
              private lateinit var bubbleContainer: FrameLayout
              private lateinit var ringOuter: View
              private lateinit var ringMiddle: View
              private lateinit var ringCore: View
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var prefs: SharedPreferences
              private var vibrator: Vibrator? = null

              private var menuView: FrameLayout? = null
              private var screensaverView: FrameLayout? = null
              private var screensaverClock: TextView? = null
              private var screensaverAmPm: TextView? = null
              private var screensaverHandler: Handler? = null
              private var lensView: WebView? = null
              private var lensOverlay: FrameLayout? = null

              private var screenWidth = 0
              private var screenHeight = 0
              private var bubbleSizePx = 0
              private var moveThresholdPx = 0

              private var downRawX = 0f
              private var downRawY = 0f
              private var initialX = 0
              private var initialY = 0
              private var downTime = 0L
              private var isDragging = false
              private var longPressTriggered = false
              private var moved = false
              private var pendingTapRunnable: Runnable? = null

              private var keyboardVisible = false
              private var preKeyboardX = 0
              private var preKeyboardY = 0

              private val handler = Handler(Looper.getMainLooper())
              private val longPressRunnable = Runnable {
                  longPressTriggered = true
                  isDragging = true
                  vibrate()
              }

              companion object {
                  const val TAP_MAX_MS = 200L
                  const val HOLD_MIN_MS = 210L
                  const val DOUBLE_TAP_WINDOW_MS = 200L
                  const val MOVE_THRESHOLD_DP = 50
                  const val SWIPE_THRESHOLD_PX = 60
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  prefs = getSharedPreferences("assistive_touch_prefs", Context.MODE_PRIVATE)
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager

                  vibrator = try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          val vm = getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as? VibratorManager
                          vm?.defaultVibrator
                      } else {
                          @Suppress("DEPRECATION")
                          getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      }
                  } catch (e: Exception) {
                      null
                  }

                  measureScreen()

                  val density = resources.displayMetrics.density
                  bubbleSizePx = (56 * density).toInt()
                  moveThresholdPx = (MOVE_THRESHOLD_DP * density).toInt()

                  buildBubbleViews(density)
                  applyIdleAppearance()

                  val savedRatioX = prefs.getFloat("anchor_edge", 1f)
                  val savedRatioY = prefs.getFloat("ratio_y", 0.5f)

                  val startX = if (savedRatioX <= 0f) 0 else screenWidth - bubbleSizePx
                  val startY = ((screenHeight - bubbleSizePx) * savedRatioY).toInt()

                  params = WindowManager.LayoutParams(
                      bubbleSizePx,
                      bubbleSizePx,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = startX
                      y = startY.coerceIn(0, maxOf(0, screenHeight - bubbleSizePx))
                  }

                  bubbleContainer.setOnTouchListener { _, event -> handleTouch(event) }
                  windowManager.addView(bubbleContainer, params)

                  serviceInfo = serviceInfo?.apply {
                      eventTypes = AccessibilityEvent.TYPES_ALL_MASK
                  }
              }

              private fun buildBubbleViews(density: Float) {
                  bubbleContainer = FrameLayout(this)

                  ringOuter = View(this).apply {
                      layoutParams = FrameLayout.LayoutParams(bubbleSizePx, bubbleSizePx)
                  }
                  val midSize = (bubbleSizePx * 0.68f).toInt()
                  ringMiddle = View(this).apply {
                      layoutParams = FrameLayout.LayoutParams(midSize, midSize).apply {
                          gravity = Gravity.CENTER
                      }
                  }
                  val coreSize = (bubbleSizePx * 0.36f).toInt()
                  ringCore = View(this).apply {
                      layoutParams = FrameLayout.LayoutParams(coreSize, coreSize).apply {
                          gravity = Gravity.CENTER
                      }
                  }

                  bubbleContainer.addView(ringOuter)
                  bubbleContainer.addView(ringMiddle)
                  bubbleContainer.addView(ringCore)
              }

              private fun measureScreen() {
                  val metrics = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  windowManager.defaultDisplay.getMetrics(metrics)
                  screenWidth = metrics.widthPixels
                  screenHeight = metrics.heightPixels
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (!::windowManager.isInitialized || !::bubbleContainer.isInitialized) return

                  handler.postDelayed({
                      measureScreen()
                      val anchorEdge = prefs.getFloat("anchor_edge", 1f)
                      val ratioY = prefs.getFloat("ratio_y", 0.5f)

                      params.x = if (anchorEdge <= 0f) 0 else screenWidth - bubbleSizePx
                      params.y = ((screenHeight - bubbleSizePx) * ratioY).toInt()
                          .coerceIn(0, maxOf(0, screenHeight - bubbleSizePx))

                      windowManager.updateViewLayout(bubbleContainer, params)
                  }, 150L)
              }

              // ---------- Keyboard avoidance ----------

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  checkKeyboardState()
              }

              private fun checkKeyboardState() {
                  if (!::windowManager.isInitialized || !::bubbleContainer.isInitialized) return
                  try {
                      val imeWindow = windows?.firstOrNull { it.type == AccessibilityWindowInfo.TYPE_INPUT_METHOD }
                      if (imeWindow != null) {
                          val bounds = android.graphics.Rect()
                          imeWindow.getBoundsInScreen(bounds)
                          if (!keyboardVisible) {
                              keyboardVisible = true
                              preKeyboardX = params.x
                              preKeyboardY = params.y
                          }
                          val keyboardTop = bounds.top
                          if (params.y + bubbleSizePx > keyboardTop) {
                              params.y = (keyboardTop - bubbleSizePx - 8).coerceAtLeast(0)
                              windowManager.updateViewLayout(bubbleContainer, params)
                          }
                      } else if (keyboardVisible) {
                          keyboardVisible = false
                          params.y = preKeyboardY.coerceIn(0, maxOf(0, screenHeight - bubbleSizePx))
                          windowManager.updateViewLayout(bubbleContainer, params)
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun vibrate(durationMs: Long = 35) {
                  val v = vibrator ?: return
                  if (!v.hasVibrator()) return
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          v.vibrate(durationMs)
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun circleDrawable(color: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(color)
                  }
              }

              private fun applyIdleAppearance() {
                  ringOuter.background = circleDrawable(Color.argb(90, 20, 20, 25))
                  ringMiddle.background = circleDrawable(Color.argb(100, 120, 120, 128))
                  ringCore.background = circleDrawable(Color.argb(130, 255, 255, 255))
              }

              private fun applyTouchedAppearance() {
                  ringOuter.background = circleDrawable(Color.argb(242, 20, 20, 25))
                  ringMiddle.background = circleDrawable(Color.argb(242, 150, 150, 158))
                  ringCore.background = circleDrawable(Color.WHITE)
              }

              private fun lockPhone() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN)
                  } else {
                      android.widget.Toast.makeText(this, "Lock requires Android 9+", android.widget.Toast.LENGTH_SHORT).show()
                  }
              }

              // ---------- Swipe-down menu ----------

              private fun showMenu() {
                  if (menuView != null) return
                  val density = resources.displayMetrics.density

                  val overlay = FrameLayout(this).apply {
                      setOnClickListener { hideMenu() }
                  }

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = 16 * density
                          setColor(Color.argb(245, 32, 32, 35))
                      }
                      val pad = (16 * density).toInt()
                      setPadding(pad, pad, pad, pad)
                      layoutParams = FrameLayout.LayoutParams(
                          (240 * density).toInt(),
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          gravity = Gravity.CENTER
                      }
                      isClickable = true
                  }

                  val row1 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  row1.addView(menuTile("Screensaver") { hideMenu(); startScreensaver() })
                  row1.addView(menuTile("Screenshot") { hideMenu(); takeScreenshotAction(saveForLens = false) })

                  val row2 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  row2.addView(menuTile("Vol -") { adjustVolume(false) })
                  row2.addView(menuTile("Vol +") { adjustVolume(true) })

                  val row3 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  row3.addView(menuTile("Bright -") { adjustBrightness(false) })
                  row3.addView(menuTile("Bright +") { adjustBrightness(true) })

                  val row4 = menuTile("Screen Search") { hideMenu(); takeScreenshotAction(saveForLens = true) }

                  card.addView(row1)
                  card.addView(spacer(density))
                  card.addView(row2)
                  card.addView(spacer(density))
                  card.addView(row3)
                  card.addView(spacer(density))
                  card.addView(row4)

                  overlay.addView(card)

                  val menuParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )

                  windowManager.addView(overlay, menuParams)
                  menuView = overlay
              }

              private fun hideMenu() {
                  menuView?.let {
                      try { windowManager.removeView(it) } catch (e: Exception) {}
                  }
                  menuView = null
              }

              private fun spacer(density: Float): View {
                  return View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          (8 * density).toInt()
                      )
                  }
              }

              private fun menuTile(label: String, onClick: () -> Unit): View {
                  val density = resources.displayMetrics.density
                  return TextView(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      gravity = Gravity.CENTER
                      val padV = (12 * density).toInt()
                      setPadding(padV, padV, padV, padV)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = 12 * density
                          setColor(Color.argb(60, 255, 255, 255))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1f
                      ).apply {
                          val m = (4 * density).toInt()
                          setMargins(m, 0, m, 0)
                      }
                      setOnClickListener { onClick() }
                  }
              }

              private fun adjustVolume(up: Boolean) {
                  val audioManager = getSystemService(Context.AUDIO_SERVICE) as android.media.AudioManager
                  audioManager.adjustStreamVolume(
                      android.media.AudioManager.STREAM_MUSIC,
                      if (up) android.media.AudioManager.ADJUST_RAISE else android.media.AudioManager.ADJUST_LOWER,
                      android.media.AudioManager.FLAG_SHOW_UI
                  )
              }

              private fun adjustBrightness(up: Boolean) {
                  try {
                      val resolver = contentResolver
                      val current = android.provider.Settings.System.getInt(
                          resolver, android.provider.Settings.System.SCREEN_BRIGHTNESS, 128
                      )
                      val step = 25
                      val newVal = (current + if (up) step else -step).coerceIn(1, 255)
                      android.provider.Settings.System.putInt(
                          resolver, android.provider.Settings.System.SCREEN_BRIGHTNESS, newVal
                      )
                  } catch (e: SecurityException) {
                      val intent = Intent(android.provider.Settings.ACTION_MANAGE_WRITE_SETTINGS)
                      intent.data = android.net.Uri.parse("package:$packageName")
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(intent)
                  }
              }

              // ---------- Screenshot / Screen Search ----------

              private fun takeScreenshotAction(saveForLens: Boolean) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      android.widget.Toast.makeText(this, "Screenshot requires Android 11+", android.widget.Toast.LENGTH_SHORT).show()
                      return
                  }
                  takeScreenshot(
                      android.view.Display.DEFAULT_DISPLAY,
                      mainExecutor,
                      object : TakeScreenshotCallback {
                          override fun onSuccess(result: ScreenshotResult) {
                              val hardwareBitmap = Bitmap.wrapHardwareBuffer(
                                  result.hardwareBuffer, result.colorSpace
                              )
                              val bitmap = hardwareBitmap?.copy(Bitmap.Config.ARGB_8888, false)
                              result.hardwareBuffer.close()

                              if (bitmap == null) {
                                  android.widget.Toast.makeText(this@AssistiveTouchService, "Screenshot failed", android.widget.Toast.LENGTH_SHORT).show()
                                  return
                              }

                              if (saveForLens) {
                                  openLensWithBitmap(bitmap)
                              } else {
                                  android.widget.Toast.makeText(this@AssistiveTouchService, "Screenshot captured", android.widget.Toast.LENGTH_SHORT).show()
                              }
                          }

                          override fun onFailure(errorCode: Int) {
                              android.widget.Toast.makeText(this@AssistiveTouchService, "Screenshot failed", android.widget.Toast.LENGTH_SHORT).show()
                          }
                      }
                  )
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun openLensWithBitmap(bitmap: Bitmap) {
                  val outputStream = ByteArrayOutputStream()
                  bitmap.compress(Bitmap.CompressFormat.JPEG, 90, outputStream)
                  val base64 = Base64.encodeToString(outputStream.toByteArray(), Base64.NO_WRAP)
                  bitmap.recycle()

                  val overlay = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                  }

                  val closeBtn = TextView(this).apply {
                      text = "Close"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      val density = resources.displayMetrics.density
                      setPadding((16 * density).toInt(), (12 * density).toInt(), (16 * density).toInt(), (12 * density).toInt())
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = 12 * density
                          setColor(Color.argb(180, 40, 40, 40))
                      }
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.END
                          val m = (24 * density).toInt()
                          setMargins(0, m, m, 0)
                      }
                      setOnClickListener { closeLens() }
                  }

                  val webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView?, url: String?) {
                              super.onPageFinished(view, url)
                              injectImageIntoLens(view, base64)
                          }
                      }
                      loadUrl("https://lens.google.com/upload")
                  }

                  overlay.addView(webView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  overlay.addView(closeBtn)

                  val lensParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.OPAQUE
                  )

                  windowManager.addView(overlay, lensParams)
                  lensOverlay = overlay
                  lensView = webView
              }

              private fun injectImageIntoLens(view: WebView?, base64: String) {
                  val js = """
                      (function() {
                          function dataURLtoFile(dataurl, filename) {
                              var arr = dataurl.split(','), mime = 'image/jpeg',
                                  bstr = atob(arr[0]), n = bstr.length, u8arr = new Uint8Array(n);
                              while (n--) { u8arr[n] = bstr.charCodeAt(n); }
                              return new File([u8arr], filename, {type: mime});
                          }
                          var file = dataURLtoFile('data:image/jpeg;base64,$base64', 'screenshot.jpg');
                          var dt = new DataTransfer();
                          dt.items.add(file);
                          var input = document.querySelector('input[type="file"]');
                          if (input) {
                              input.files = dt.files;
                              var event = new Event('change', { bubbles: true });
                              input.dispatchEvent(event);
                          }
                      })();
                  """.trimIndent()
                  view?.evaluateJavascript(js, null)
              }

              private fun closeLens() {
                  lensOverlay?.let {
                      try { windowManager.removeView(it) } catch (e: Exception) {}
                  }
                  lensView?.destroy()
                  lensView = null
                  lensOverlay = null
              }

              // ---------- Screensaver ----------

              private fun startScreensaver() {
                  if (screensaverView != null) return
                  val density = resources.displayMetrics.density
                  val edgeMargin = (24 * density).toInt()

                  val overlay = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                  }

                  val clockContainer = FrameLayout(this)

                  val clock = TextView(this).apply {
                      textSize = 34f
                      setTextColor(Color.argb(140, 255, 255, 255))
                      gravity = Gravity.CENTER
                  }
                  val ampm = TextView(this).apply {
                      textSize = 12f
                      setTextColor(Color.argb(90, 255, 255, 255))
                      gravity = Gravity.CENTER
                  }

                  val textWrap = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      addView(clock)
                      addView(ampm)
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      ).apply { gravity = Gravity.CENTER }
                  }
                  clockContainer.addView(textWrap)

                  overlay.addView(clockContainer, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  screensaverView = overlay
                  screensaverClock = clock
                  screensaverAmPm = ampm

                  var touchStartY = 0f
                  overlay.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              touchStartY = event.y
                              val safeTop = edgeMargin * 2
                              val safeBottom = screenHeight - edgeMargin * 2
                              if (event.y < safeTop || event.y > safeBottom) return@setOnTouchListener true
                          }
                          MotionEvent.ACTION_UP -> {
                              val dy = touchStartY - event.y
                              if (dy > SWIPE_THRESHOLD_PX) {
                                  exitScreensaver()
                              }
                          }
                      }
                      true
                  }

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.OPAQUE
                  )
                  windowManager.addView(overlay, lp)

                  updateScreensaverClock()
                  screensaverHandler = Handler(Looper.getMainLooper())
                  scheduleClockTick()
              }

              private var clockStopIndex = 0
              private fun scheduleClockTick() {
                  screensaverHandler?.postDelayed({
                      updateScreensaverClock()
                      scheduleClockTick()
                  }, 60_000L)
              }

              private fun updateScreensaverClock() {
                  val sdf = SimpleDateFormat("hh:mm", Locale.getDefault())
                  val ampmFmt = SimpleDateFormat("a", Locale.getDefault())
                  val now = Date()
                  screensaverClock?.text = sdf.format(now)
                  screensaverAmPm?.text = ampmFmt.format(now)

                  val density = resources.displayMetrics.density
                  val stops = listOf(-40, 0, 40)
                  val offset = stops[clockStopIndex % stops.size]
                  clockStopIndex++

                  val parent = screensaverClock?.parent?.parent as? LinearLayout
                  parent?.translationY = offset * density
              }

              private fun exitScreensaver() {
                  screensaverHandler?.removeCallbacksAndMessages(null)
                  screensaverHandler = null
                  screensaverView?.let {
                      try { windowManager.removeView(it) } catch (e: Exception) {}
                  }
                  screensaverView = null
                  screensaverClock = null
                  screensaverAmPm = null
                  clockStopIndex = 0
              }

              // ---------- Gesture handling ----------

              private fun handleTouch(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          downRawX = event.rawX
                          downRawY = event.rawY
                          initialX = params.x
                          initialY = params.y
                          downTime = System.currentTimeMillis()
                          isDragging = false
                          longPressTriggered = false
                          moved = false
                          applyTouchedAppearance()
                          handler.postDelayed(longPressRunnable, HOLD_MIN_MS)
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = event.rawX - downRawX
                          val dy = event.rawY - downRawY

                          if (!moved && (abs(dx) > moveThresholdPx || abs(dy) > moveThresholdPx)) {
                              moved = true
                              if (!longPressTriggered) handler.removeCallbacks(longPressRunnable)
                          }

                          if (isDragging) {
                              params.x = (initialX + dx.toInt()).coerceIn(0, screenWidth - bubbleSizePx)
                              params.y = (initialY + dy.toInt()).coerceIn(0, screenHeight - bubbleSizePx)
                              windowManager.updateViewLayout(bubbleContainer, params)
                          }
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          handler.removeCallbacks(longPressRunnable)
                          applyIdleAppearance()

                          val dx = event.rawX - downRawX
                          val dy = event.rawY - downRawY
                          val elapsed = System.currentTimeMillis() - downTime

                          if (isDragging) {
                              snapToNearestEdge()
                          } else if (!moved && elapsed < TAP_MAX_MS) {
                              if (pendingTapRunnable != null) {
                                  // second tap arrived within window -> double tap -> lock
                                  handler.removeCallbacks(pendingTapRunnable!!)
                                  pendingTapRunnable = null
                                  vibrate(45)
                                  lockPhone()
                              } else {
                                  // first tap -> wait to see if a second tap comes
                                  val runnable = Runnable {
                                      vibrate()
                                      performGlobalAction(GLOBAL_ACTION_BACK)
                                      pendingTapRunnable = null
                                  }
                                  pendingTapRunnable = runnable
                                  handler.postDelayed(runnable, DOUBLE_TAP_WINDOW_MS)
                              }
                          } else {
                              val swipedUp = dy < -SWIPE_THRESHOLD_PX && abs(dy) > abs(dx)
                              val swipedDown = dy > SWIPE_THRESHOLD_PX && abs(dy) > abs(dx)
                              when {
                                  swipedUp -> performGlobalAction(GLOBAL_ACTION_RECENTS)
                                  swipedDown -> showMenu()
                              }
                          }
                          isDragging = false
                          return true
                      }
                  }
                  return false
              }

              private fun snapToNearestEdge() {
                  val centerX = params.x + bubbleSizePx / 2
                  val snapToLeft = centerX < screenWidth / 2
                  val targetX = if (snapToLeft) 0 else screenWidth - bubbleSizePx

                  val startX = params.x
                  val distance = targetX - startX
                  val steps = 8
                  var step = 0

                  val animator = object : Runnable {
                      override fun run() {
                          step++
                          val progress = step.toFloat() / steps
                          params.x = (startX + distance * progress).toInt()
                          windowManager.updateViewLayout(bubbleContainer, params)
                          if (step < steps) {
                              handler.postDelayed(this, 8L)
                          } else {
                              params.x = targetX
                              windowManager.updateViewLayout(bubbleContainer, params)
                              saveAnchor(snapToLeft)
                          }
                      }
                  }
                  handler.post(animator)
              }

              private fun saveAnchor(isLeft: Boolean) {
                  val ratioY = params.y.toFloat() / maxOf(1, screenHeight - bubbleSizePx)
                  prefs.edit()
                      .putFloat("anchor_edge", if (isLeft) 0f else 1f)
                      .putFloat("ratio_y", ratioY.coerceIn(0f, 1f))
                      .apply()
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  hideMenu()
                  exitScreensaver()
                  closeLens()
                  if (::bubbleContainer.isInitialized && ::windowManager.isInitialized) {
                      windowManager.removeView(bubbleContainer)
                  }
              }
          }
