name: Build Greytouch APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate project structure
        run: |
          mkdir -p app/src/main/java/com/grey/touch
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/java/com/grey/touch/MainActivity.kt << 'KOTLIN_EOF'
          package com.grey.touch

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.RectangleShape
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {

              private var enabled by mutableStateOf(false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enabled = isServiceEnabled()

                  setContent {
                      val bg = Color(0xFF1C1C1E)
                      val grey = Color(0xFF3A3A3C)
                      Box(modifier = Modifier.fillMaxSize().background(bg)) {
                          Column(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .verticalScroll(rememberScrollState())
                                  .padding(24.dp)
                          ) {
                              Text("Greytouch", color = Color.White, fontSize = 26.sp)
                              Spacer(modifier = Modifier.height(8.dp))
                              Text(
                                  if (enabled) "Status: enabled" else "Status: not enabled",
                                  color = Color.White,
                                  fontSize = 16.sp
                              )
                              Spacer(modifier = Modifier.height(24.dp))

                              Text("Setup", color = Color.White, fontSize = 18.sp)
                              Spacer(modifier = Modifier.height(8.dp))
                              Text(
                                  "1. Tap the button below to open Accessibility Settings.\n" +
                                  "2. Find Greytouch in the list of installed apps.\n" +
                                  "3. Turn it on and allow.\n" +
                                  "4. For brightness controls, allow \"Modify system settings\" when asked.",
                                  color = Color(0xFFD0D0D4),
                                  fontSize = 15.sp,
                                  lineHeight = 22.sp
                              )
                              Spacer(modifier = Modifier.height(24.dp))

                              Text("Gestures", color = Color.White, fontSize = 18.sp)
                              Spacer(modifier = Modifier.height(8.dp))
                              Text(
                                  "Tap: Back\n" +
                                  "Double tap: Lock screen\n" +
                                  "Swipe up: Recents\n" +
                                  "Swipe left or right: Home\n" +
                                  "Swipe down: Menu\n" +
                                  "Hold, then drag: Move the bubble (snaps to the nearest edge)",
                                  color = Color(0xFFD0D0D4),
                                  fontSize = 15.sp,
                                  lineHeight = 22.sp
                              )
                              Spacer(modifier = Modifier.height(24.dp))

                              Text("Menu", color = Color.White, fontSize = 18.sp)
                              Spacer(modifier = Modifier.height(8.dp))
                              Text(
                                  "Screensaver, Screenshot, Volume - / +, Brightness - / +.\n" +
                                  "Hold the volume or brightness buttons to repeat.",
                                  color = Color(0xFFD0D0D4),
                                  fontSize = 15.sp,
                                  lineHeight = 22.sp
                              )
                              Spacer(modifier = Modifier.height(32.dp))

                              Button(
                                  onClick = { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) },
                                  shape = RectangleShape,
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = grey,
                                      contentColor = Color.White
                                  )
                              ) {
                                  Text("Open Accessibility Settings")
                              }
                          }
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  enabled = isServiceEnabled()
              }

              private fun isServiceEnabled(): Boolean {
                  val expected = "$packageName/${AssistiveTouchService::class.java.canonicalName}"
                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val splitter = TextUtils.SimpleStringSplitter(':')
                  splitter.setString(enabledServices)
                  while (splitter.hasNext()) {
                      if (splitter.next().equals(expected, ignoreCase = true)) return true
                  }
                  return false
              }
          }
          KOTLIN_EOF

          cat > app/src/main/java/com/grey/touch/ClockTickReceiver.kt << 'KOTLIN_EOF'
          package com.grey.touch

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class ClockTickReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context?, intent: Intent?) {
                  AssistiveTouchService.instance?.onClockTickAlarm()
              }
          }
          KOTLIN_EOF

          cat > app/src/main/java/com/grey/touch/AssistiveTouchService.kt << 'KOTLIN_EOF'
          package com.grey.touch

          import android.accessibilityservice.AccessibilityService
          import android.annotation.SuppressLint
          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.util.DisplayMetrics
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityWindowInfo
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.abs

          class AssistiveTouchService : AccessibilityService() {

              companion object {
                  const val TAP_MAX_MS = 200L
                  const val HOLD_MIN_MS = 210L
                  const val DOUBLE_TAP_WINDOW_MS = 200L
                  const val MOVE_THRESHOLD_DP = 50
                  const val SWIPE_THRESHOLD_PX = 60
                  const val REPEAT_INTERVAL_MS = 180L
                  const val CLOCK_ALARM_REQUEST_CODE = 4201

                  // false = square bubble (matches the flat menu), true = round bubble
                  const val BUBBLE_OVAL = false

                  val GREY_DARK = Color.rgb(28, 28, 30)
                  val GREY = Color.rgb(58, 58, 60)

                  var instance: AssistiveTouchService? = null
              }

              private lateinit var windowManager: WindowManager
              private lateinit var bubbleContainer: FrameLayout
              private lateinit var ringOuter: View
              private lateinit var ringMiddle: View
              private lateinit var ringCore: View
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var prefs: SharedPreferences
              private var vibrator: Vibrator? = null

              private var menuView: FrameLayout? = null
              private var screensaverView: FrameLayout? = null
              private var screensaverClock: TextView? = null
              private var screensaverAmPm: TextView? = null
              private var preScreensaverBrightness: Int = -1

              private var screenWidth = 0
              private var screenHeight = 0
              private var bubbleSizePx = 0
              private var moveThresholdPx = 0

              private var downRawX = 0f
              private var downRawY = 0f
              private var initialX = 0
              private var initialY = 0
              private var downTime = 0L
              private var isDragging = false
              private var longPressTriggered = false
              private var moved = false
              private var pendingTapRunnable: Runnable? = null

              private var keyboardVisible = false
              private var preKeyboardY = 0

              private val handler = Handler(Looper.getMainLooper())
              private val longPressRunnable = Runnable {
                  longPressTriggered = true
                  isDragging = true
                  vibrate()
              }

              private var repeatHandler: Handler? = null
              private var repeatRunnable: Runnable? = null

              private var screensaverHandler: Handler? = null
              private var screensaverRunnable: Runnable? = null
              private var lastClockUpdateElapsed = 0L
              private var clockStopIndex = 0

              override fun onCreate() {
                  super.onCreate()
                  instance = this
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  prefs = getSharedPreferences("assistive_touch_prefs", Context.MODE_PRIVATE)
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager

                  vibrator = try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          val vm = getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as? VibratorManager
                          vm?.defaultVibrator
                      } else {
                          @Suppress("DEPRECATION")
                          getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      }
                  } catch (e: Exception) {
                      null
                  }

                  measureScreen()

                  val density = resources.displayMetrics.density
                  bubbleSizePx = (56 * density).toInt()
                  moveThresholdPx = (MOVE_THRESHOLD_DP * density).toInt()

                  buildBubbleViews()
                  applyIdleAppearance()

                  val savedRatioX = prefs.getFloat("anchor_edge", 1f)
                  val savedRatioY = prefs.getFloat("ratio_y", 0.5f)

                  val startX = if (savedRatioX <= 0f) 0 else screenWidth - bubbleSizePx
                  val startY = ((screenHeight - bubbleSizePx) * savedRatioY).toInt()

                  params = WindowManager.LayoutParams(
                      bubbleSizePx,
                      bubbleSizePx,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = startX
                      y = startY.coerceIn(0, maxOf(0, screenHeight - bubbleSizePx))
                  }

                  bubbleContainer.setOnTouchListener { _, event -> handleTouch(event) }
                  windowManager.addView(bubbleContainer, params)

                  serviceInfo = serviceInfo?.apply {
                      eventTypes = AccessibilityEvent.TYPES_ALL_MASK
                  }
              }

              private fun buildBubbleViews() {
                  bubbleContainer = FrameLayout(this)

                  ringOuter = View(this).apply {
                      layoutParams = FrameLayout.LayoutParams(bubbleSizePx, bubbleSizePx)
                  }
                  val midSize = (bubbleSizePx * 0.68f).toInt()
                  ringMiddle = View(this).apply {
                      layoutParams = FrameLayout.LayoutParams(midSize, midSize).apply {
                          gravity = Gravity.CENTER
                      }
                  }
                  val coreSize = (bubbleSizePx * 0.34f).toInt()
                  ringCore = View(this).apply {
                      layoutParams = FrameLayout.LayoutParams(coreSize, coreSize).apply {
                          gravity = Gravity.CENTER
                      }
                  }

                  bubbleContainer.addView(ringOuter)
                  bubbleContainer.addView(ringMiddle)
                  bubbleContainer.addView(ringCore)
              }

              private fun measureScreen() {
                  val metrics = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  windowManager.defaultDisplay.getMetrics(metrics)
                  screenWidth = metrics.widthPixels
                  screenHeight = metrics.heightPixels
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (!::windowManager.isInitialized || !::bubbleContainer.isInitialized) return

                  handler.postDelayed({
                      measureScreen()
                      val anchorEdge = prefs.getFloat("anchor_edge", 1f)
                      val ratioY = prefs.getFloat("ratio_y", 0.5f)

                      params.x = if (anchorEdge <= 0f) 0 else screenWidth - bubbleSizePx
                      params.y = ((screenHeight - bubbleSizePx) * ratioY).toInt()
                          .coerceIn(0, maxOf(0, screenHeight - bubbleSizePx))

                      windowManager.updateViewLayout(bubbleContainer, params)
                  }, 150L)
              }

              // ---------- Keyboard avoidance ----------

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  checkKeyboardState()
              }

              private fun checkKeyboardState() {
                  if (!::windowManager.isInitialized || !::bubbleContainer.isInitialized) return
                  try {
                      val imeWindow = windows?.firstOrNull { it.type == AccessibilityWindowInfo.TYPE_INPUT_METHOD }
                      if (imeWindow != null) {
                          val bounds = android.graphics.Rect()
                          imeWindow.getBoundsInScreen(bounds)
                          if (!keyboardVisible) {
                              keyboardVisible = true
                              preKeyboardY = params.y
                          }
                          val keyboardTop = bounds.top
                          if (params.y + bubbleSizePx > keyboardTop) {
                              params.y = (keyboardTop - bubbleSizePx - 8).coerceAtLeast(0)
                              windowManager.updateViewLayout(bubbleContainer, params)
                          }
                      } else if (keyboardVisible) {
                          keyboardVisible = false
                          params.y = preKeyboardY.coerceIn(0, maxOf(0, screenHeight - bubbleSizePx))
                          windowManager.updateViewLayout(bubbleContainer, params)
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun vibrate(durationMs: Long = 35) {
                  val v = vibrator ?: return
                  if (!v.hasVibrator()) return
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          v.vibrate(durationMs)
                      }
                  } catch (e: Exception) {
                  }
              }

              // ---------- Bubble look (grey + white accent, negative on touch) ----------

              private fun boxDrawable(fill: Int, stroke: Int = 0, strokeDp: Int = 0): GradientDrawable {
                  val density = resources.displayMetrics.density
                  return GradientDrawable().apply {
                      shape = if (BUBBLE_OVAL) GradientDrawable.OVAL else GradientDrawable.RECTANGLE
                      setColor(fill)
                      if (strokeDp > 0) setStroke((strokeDp * density).toInt().coerceAtLeast(1), stroke)
                  }
              }

              private fun applyIdleAppearance() {
                  ringOuter.background = boxDrawable(Color.argb(110, 58, 58, 60), Color.argb(160, 255, 255, 255), 1)
                  ringMiddle.background = boxDrawable(Color.argb(120, 28, 28, 30))
                  ringCore.background = boxDrawable(Color.argb(150, 255, 255, 255))
              }

              // negative: grey becomes white, white becomes black
              private fun applyTouchedAppearance() {
                  ringOuter.background = boxDrawable(Color.WHITE, Color.WHITE, 1)
                  ringMiddle.background = boxDrawable(GREY)
                  ringCore.background = boxDrawable(Color.BLACK)
              }

              private fun lockPhone() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN)
                  } else {
                      android.widget.Toast.makeText(this, "Lock requires Android 9+", android.widget.Toast.LENGTH_SHORT).show()
                  }
              }

              // ---------- Swipe-down menu ----------

              private fun showMenu() {
                  if (menuView != null) return
                  val density = resources.displayMetrics.density

                  val overlay = FrameLayout(this).apply {
                      setOnClickListener { hideMenu() }
                  }

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          setColor(GREY_DARK)
                          setStroke((1 * density).toInt().coerceAtLeast(1), Color.argb(200, 255, 255, 255))
                      }
                      val pad = (12 * density).toInt()
                      setPadding(pad, pad, pad, pad)
                      layoutParams = FrameLayout.LayoutParams(
                          (240 * density).toInt(),
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          gravity = Gravity.CENTER
                      }
                      isClickable = true
                  }

                  val title = TextView(this).apply {
                      text = "GREYTOUCH"
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      letterSpacing = 0.25f
                      setTypeface(typeface, Typeface.BOLD)
                      val m = (4 * density).toInt()
                      setPadding(m, 0, m, (8 * density).toInt())
                  }

                  card.addView(title)
                  card.addView(menuRow(
                      menuTile("Screensaver", false) { hideMenu(); startScreensaver() },
                      menuTile("Screenshot", false) { hideMenu(); takeSystemScreenshot() }
                  ))
                  card.addView(spacer(density))
                  card.addView(menuRow(
                      menuTile("Vol -", true) { adjustVolume(false) },
                      menuTile("Vol +", true) { adjustVolume(true) }
                  ))
                  card.addView(spacer(density))
                  card.addView(menuRow(
                      menuTile("Bright -", true) { adjustBrightness(false) },
                      menuTile("Bright +", true) { adjustBrightness(true) }
                  ))

                  overlay.addView(card)

                  val menuParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )

                  windowManager.addView(overlay, menuParams)
                  menuView = overlay
              }

              private fun hideMenu() {
                  stopRepeat()
                  menuView?.let {
                      try { windowManager.removeView(it) } catch (e: Exception) {}
                  }
                  menuView = null
              }

              private fun menuRow(vararg tiles: View): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      tiles.forEach { addView(it) }
                  }
              }

              private fun spacer(density: Float): View {
                  return View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          (8 * density).toInt()
                      )
                  }
              }

              // Flat tile: grey with white text; while pressed it goes negative (white with black text)
              private fun setTileLook(tv: TextView, pressed: Boolean) {
                  tv.setBackgroundColor(if (pressed) Color.WHITE else GREY)
                  tv.setTextColor(if (pressed) Color.BLACK else Color.WHITE)
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun menuTile(label: String, repeat: Boolean, action: () -> Unit): View {
                  val density = resources.displayMetrics.density
                  return TextView(this).apply {
                      text = label
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setTileLook(this, false)
                      val padV = (14 * density).toInt()
                      setPadding(padV, padV, padV, padV)
                      layoutParams = LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1f
                      ).apply {
                          val m = (3 * density).toInt()
                          setMargins(m, 0, m, 0)
                      }
                      setOnTouchListener { v, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  setTileLook(this, true)
                                  if (repeat) startRepeat(action)
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> true
                              MotionEvent.ACTION_UP -> {
                                  setTileLook(this, false)
                                  if (repeat) {
                                      stopRepeat()
                                  } else if (event.x >= 0f && event.x <= v.width && event.y >= 0f && event.y <= v.height) {
                                      action()
                                  }
                                  true
                              }
                              MotionEvent.ACTION_CANCEL -> {
                                  setTileLook(this, false)
                                  if (repeat) stopRepeat()
                                  true
                              }
                              else -> false
                          }
                      }
                  }
              }

              private fun startRepeat(action: () -> Unit) {
                  stopRepeat()
                  action()
                  val h = Handler(Looper.getMainLooper())
                  repeatHandler = h
                  val r = object : Runnable {
                      override fun run() {
                          action()
                          h.postDelayed(this, REPEAT_INTERVAL_MS)
                      }
                  }
                  repeatRunnable = r
                  h.postDelayed(r, REPEAT_INTERVAL_MS)
              }

              private fun stopRepeat() {
                  repeatRunnable?.let { repeatHandler?.removeCallbacks(it) }
                  repeatRunnable = null
                  repeatHandler = null
              }

              private fun adjustVolume(up: Boolean) {
                  val audioManager = getSystemService(Context.AUDIO_SERVICE) as android.media.AudioManager
                  audioManager.adjustStreamVolume(
                      android.media.AudioManager.STREAM_MUSIC,
                      if (up) android.media.AudioManager.ADJUST_RAISE else android.media.AudioManager.ADJUST_LOWER,
                      android.media.AudioManager.FLAG_SHOW_UI
                  )
              }

              private fun getBrightness(): Int {
                  return try {
                      android.provider.Settings.System.getInt(
                          contentResolver, android.provider.Settings.System.SCREEN_BRIGHTNESS, 128
                      )
                  } catch (e: Exception) {
                      128
                  }
              }

              private fun setBrightness(value: Int) {
                  try {
                      android.provider.Settings.System.putInt(
                          contentResolver, android.provider.Settings.System.SCREEN_BRIGHTNESS, value.coerceIn(1, 255)
                      )
                  } catch (e: SecurityException) {
                      val intent = Intent(android.provider.Settings.ACTION_MANAGE_WRITE_SETTINGS)
                      intent.data = android.net.Uri.parse("package:$packageName")
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(intent)
                  }
              }

              private fun adjustBrightness(up: Boolean) {
                  val current = getBrightness()
                  val step = 8
                  setBrightness(current + if (up) step else -step)
              }

              // ---------- Plain screenshot ----------

              private fun takeSystemScreenshot() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.P) {
                      android.widget.Toast.makeText(this, "Screenshot requires Android 9+", android.widget.Toast.LENGTH_SHORT).show()
                      return
                  }
                  performGlobalAction(GLOBAL_ACTION_TAKE_SCREENSHOT)
                  android.widget.Toast.makeText(this, "Screenshot captured", android.widget.Toast.LENGTH_SHORT).show()
              }

              // ---------- Screensaver ----------

              private fun msUntilNextMinuteBoundary(): Long {
                  val now = System.currentTimeMillis()
                  val remainder = now % 60_000L
                  return 60_000L - remainder
              }

              private fun startScreensaver() {
                  if (screensaverView != null) return
                  val density = resources.displayMetrics.density
                  val edgeMargin = (24 * density).toInt()

                  preScreensaverBrightness = getBrightness()
                  setBrightness(1)

                  val overlay = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                  }

                  val clockContainer = FrameLayout(this)

                  val clock = TextView(this).apply {
                      textSize = 52f
                      setTypeface(typeface, Typeface.BOLD)
                      setTextColor(Color.argb(150, 255, 255, 255))
                      gravity = Gravity.CENTER
                  }
                  val ampm = TextView(this).apply {
                      textSize = 14f
                      setTypeface(typeface, Typeface.BOLD)
                      setTextColor(Color.argb(100, 255, 255, 255))
                      gravity = Gravity.CENTER
                  }

                  val textWrap = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      addView(clock)
                      addView(ampm)
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      ).apply { gravity = Gravity.CENTER }
                  }
                  clockContainer.addView(textWrap)

                  overlay.addView(clockContainer, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  screensaverView = overlay
                  screensaverClock = clock
                  screensaverAmPm = ampm
                  lastClockUpdateElapsed = 0L
                  clockStopIndex = 0

                  var touchStartY = 0f
                  overlay.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              touchStartY = event.y
                              val safeTop = edgeMargin * 2
                              val safeBottom = screenHeight - edgeMargin * 2
                              if (event.y < safeTop || event.y > safeBottom) return@setOnTouchListener true
                          }
                          MotionEvent.ACTION_UP -> {
                              val dy = touchStartY - event.y
                              if (dy > SWIPE_THRESHOLD_PX) {
                                  exitScreensaver()
                              }
                          }
                      }
                      true
                  }

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                          or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.OPAQUE
                  )
                  windowManager.addView(overlay, lp)

                  applySystemBarsHidden(overlay)
                  overlay.setOnSystemUiVisibilityChangeListener {
                      applySystemBarsHidden(overlay)
                  }

                  updateScreensaverClock()

                  screensaverHandler = Handler(Looper.getMainLooper())
                  screensaverRunnable = object : Runnable {
                      override fun run() {
                          try { updateScreensaverClock() } catch (e: Exception) {}
                          screensaverHandler?.postDelayed(this, msUntilNextMinuteBoundary())
                      }
                  }
                  screensaverHandler?.postDelayed(screensaverRunnable!!, msUntilNextMinuteBoundary())

                  scheduleClockAlarm()
              }

              @Suppress("DEPRECATION")
              private fun applySystemBarsHidden(overlay: View) {
                  overlay.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  )
              }

              fun onClockTickAlarm() {
                  if (screensaverView == null) return
                  updateScreensaverClock()
                  scheduleClockAlarm()
              }

              private fun scheduleClockAlarm() {
                  val alarmManager = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(this, ClockTickReceiver::class.java)
                  val pendingIntent = PendingIntent.getBroadcast(
                      this, CLOCK_ALARM_REQUEST_CODE, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val delay = msUntilNextMinuteBoundary()
                  val triggerAt = SystemClock.elapsedRealtime() + delay
                  try {
                      alarmManager.set(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pendingIntent)
                  } catch (e: Exception) {
                  }
              }

              private fun cancelClockAlarm() {
                  val alarmManager = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(this, ClockTickReceiver::class.java)
                  val pendingIntent = PendingIntent.getBroadcast(
                      this, CLOCK_ALARM_REQUEST_CODE, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  try { alarmManager.cancel(pendingIntent) } catch (e: Exception) {}
              }

              private fun updateScreensaverClock() {
                  val clockRef = screensaverClock ?: return
                  val ampmRef = screensaverAmPm ?: return

                  val now = SystemClock.elapsedRealtime()
                  if (lastClockUpdateElapsed != 0L && now - lastClockUpdateElapsed < 5000L) return
                  lastClockUpdateElapsed = now

                  val sdf = SimpleDateFormat("hh:mm", Locale.getDefault())
                  val ampmFmt = SimpleDateFormat("a", Locale.getDefault())
                  val date = Date()
                  clockRef.text = sdf.format(date)
                  ampmRef.text = ampmFmt.format(date)

                  val density = resources.displayMetrics.density
                  val stops = listOf(-40f, 0f, 40f)
                  val offset = stops[clockStopIndex % stops.size]
                  clockStopIndex++

                  val wrap = clockRef.parent as? LinearLayout
                  wrap?.translationY = offset * density
              }

              private fun exitScreensaver() {
                  screensaverRunnable?.let { screensaverHandler?.removeCallbacks(it) }
                  screensaverHandler = null
                  screensaverRunnable = null
                  cancelClockAlarm()

                  screensaverView?.let {
                      try { windowManager.removeView(it) } catch (e: Exception) {}
                  }
                  screensaverView = null
                  screensaverClock = null
                  screensaverAmPm = null
                  clockStopIndex = 0

                  if (preScreensaverBrightness >= 0) {
                      setBrightness(preScreensaverBrightness)
                      preScreensaverBrightness = -1
                  }
              }

              // ---------- Gesture handling ----------

              private fun handleTouch(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          downRawX = event.rawX
                          downRawY = event.rawY
                          initialX = params.x
                          initialY = params.y
                          downTime = System.currentTimeMillis()
                          isDragging = false
                          longPressTriggered = false
                          moved = false
                          applyTouchedAppearance()
                          handler.postDelayed(longPressRunnable, HOLD_MIN_MS)
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = event.rawX - downRawX
                          val dy = event.rawY - downRawY

                          if (!moved && (abs(dx) > moveThresholdPx || abs(dy) > moveThresholdPx)) {
                              moved = true
                              if (!longPressTriggered) handler.removeCallbacks(longPressRunnable)
                          }

                          if (isDragging) {
                              params.x = (initialX + dx.toInt()).coerceIn(0, screenWidth - bubbleSizePx)
                              params.y = (initialY + dy.toInt()).coerceIn(0, screenHeight - bubbleSizePx)
                              windowManager.updateViewLayout(bubbleContainer, params)
                          }
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          handler.removeCallbacks(longPressRunnable)
                          applyIdleAppearance()

                          val dx = event.rawX - downRawX
                          val dy = event.rawY - downRawY
                          val elapsed = System.currentTimeMillis() - downTime

                          if (isDragging) {
                              snapToNearestEdge()
                          } else if (!moved && elapsed < TAP_MAX_MS) {
                              if (pendingTapRunnable != null) {
                                  handler.removeCallbacks(pendingTapRunnable!!)
                                  pendingTapRunnable = null
                                  vibrate(45)
                                  lockPhone()
                              } else {
                                  val runnable = Runnable {
                                      vibrate()
                                      performGlobalAction(GLOBAL_ACTION_BACK)
                                      pendingTapRunnable = null
                                  }
                                  pendingTapRunnable = runnable
                                  handler.postDelayed(runnable, DOUBLE_TAP_WINDOW_MS)
                              }
                          } else {
                              val absDx = abs(dx)
                              val absDy = abs(dy)
                              val swipedUp = dy < -SWIPE_THRESHOLD_PX && absDy > absDx
                              val swipedDown = dy > SWIPE_THRESHOLD_PX && absDy > absDx
                              val swipedHorizontal = absDx > SWIPE_THRESHOLD_PX && absDx > absDy
                              when {
                                  swipedUp -> performGlobalAction(GLOBAL_ACTION_RECENTS)
                                  swipedDown -> showMenu()
                                  swipedHorizontal -> performGlobalAction(GLOBAL_ACTION_HOME)
                              }
                          }
                          isDragging = false
                          return true
                      }
                  }
                  return false
              }

              private fun snapToNearestEdge() {
                  val centerX = params.x + bubbleSizePx / 2
                  val snapToLeft = centerX < screenWidth / 2
                  val targetX = if (snapToLeft) 0 else screenWidth - bubbleSizePx

                  val startX = params.x
                  val distance = targetX - startX
                  val steps = 8
                  var step = 0

                  val animator = object : Runnable {
                      override fun run() {
                          step++
                          val progress = step.toFloat() / steps
                          params.x = (startX + distance * progress).toInt()
                          windowManager.updateViewLayout(bubbleContainer, params)
                          if (step < steps) {
                              handler.postDelayed(this, 8L)
                          } else {
                              params.x = targetX
                              windowManager.updateViewLayout(bubbleContainer, params)
                              saveAnchor(snapToLeft)
                          }
                      }
                  }
                  handler.post(animator)
              }

              private fun saveAnchor(isLeft: Boolean) {
                  val ratioY = params.y.toFloat() / maxOf(1, screenHeight - bubbleSizePx)
                  prefs.edit()
                      .putFloat("anchor_edge", if (isLeft) 0f else 1f)
                      .putFloat("ratio_y", ratioY.coerceIn(0f, 1f))
                      .apply()
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
                  hideMenu()
                  exitScreensaver()
                  if (::bubbleContainer.isInitialized && ::windowManager.isInitialized) {
                      try { windowManager.removeView(bubbleContainer) } catch (e: Exception) {}
                  }
              }
          }
